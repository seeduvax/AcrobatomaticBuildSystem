VERSION:=5.4.3
LUAPVERSION:=0.9
ARGPARSEVERSION:=0.7.1

SRCURL:=https://www.lua.org/ftp/lua-$(VERSION).tar.gz
PRODUCT:=lua

LUAPSRCURL:=https://github.com/dpapavas/luaprompt/archive/refs/tags/v$(LUAPVERSION).tar.gz
ARGPARSESRCURL:=https://github.com/luarocks/argparse/archive/refs/tags/$(ARGPARSEVERSION).tar.gz


SPVERSION:=$(subst ., ,$(VERSION))
VERSIONMAJ:=$(word 1,$(SPVERSION))
VERSIONMED:=$(word 2,$(SPVERSION))
SHORTVERSION:=$(VERSIONMAJ)$(VERSIONMED)
MEDVERSION:=$(VERSIONMAJ).$(VERSIONMED)

IMPORTEXTRA_COMMUN:=LUA_DIR:=$$(dir $$(lastword $$(MAKEFILE_LIST)))\nLUA_CMD:=$$(LUA_DIR)/bin/lua\n
IMPORTEXTRA_WINDOWS:=LUA_PATH=$$(shell cygpath -wp $$(subst $$(_space_),;,$$(TRDIR)/?.lua $$(TRDIR)/?/init.lua $$(foreach entry,$$(patsubst -L%%,%%,$$(filter -L%%,$$(LDFLAGS))),$$(entry)/?.lua $$(entry)/?/init.lua $$(entry)/lua/?.lua $$(entry)/lua/?/init.lua $$(entry)/lua/$(MEDVERSION)/?.lua $$(entry)/lua/$(MEDVERSION)/?/init.lua))))\nLUA_CPATH=$$(shell cygpath -wp $$(subst $$(_space_),;,$$(TRDIR)/bin/?.dll $$(TRDIR)/bin/lib?.dll $$(foreach entry,$$(patsubst -L%%,%%,$$(filter -L%%,$$(LDFLAGS))),$$(entry)/?.dll $$(entry)/lib?.dll $$(entry)/lua/?.dll $$(entry)/lua/lib?.dll $$(entry)/lua/$(MEDVERSION)/?.dll $$(entry)/lua/$(MEDVERSION)/lib?.dll))))\n\n
IMPORTEXTRA_LINUX:=LUA_PATH=$$(subst $$(_space_),;,$$(TRDIR)/?.lua $$(TRDIR)/?/init.lua $$(foreach entry,$$(patsubst -L%%,%%,$$(filter -L%%,$$(LDFLAGS))),$$(entry)/?.lua $$(entry)/?/init.lua $$(entry)/lua/?.lua $$(entry)/lua/?/init.lua $$(entry)/lua/$(MEDVERSION)/?.lua $$(entry)/lua/$(MEDVERSION)/?/init.lua)))\nLUA_CPATH=$$(subst $$(_space_),;,$$(foreach entry,$$(patsubst -L%%,%%,$$(filter -L%%,$$(LDFLAGS))),$$(entry)/?.so $$(entry)/lib?.so $$(entry)/lua/?.so $$(entry)/lua/lib?.so $$(entry)/lua/$(MEDVERSION)/?.so $$(entry)/lua/$(MEDVERSION)/lib?.so)))\n\n
IMPORTEXTRA_TARGETS:=lua: all\n\t@PATH=$$(RUNPATH) LD_LIBRARY_PATH="$$(LDLIBP)" LUA_CPATH="$$(LUA_CPATH)" $$(LUA_CMD) $$(RUNARGS)\n\nluap: all\n\t@PATH=$$(RUNPATH) LD_LIBRARY_PATH="$$(LDLIBP)" LUA_PATH="$$(LUA_PATH)" LUA_CPATH="$$(LUA_CPATH)" $$(LUA_CMD) $$(LUA_DIR)/bin/luap $$(RUNARGS)\n\n

MIARGS=
ifneq ($(filter true,$(ISWINDOWS))$(filter mingw,$(CROSS_ARCH)),)
MARGS=PLAT=mingw
MIARGS+=TO_BIN="lua.exe luac.exe"
# cannot compile luaprompt with mingw : $(INSTDIR)/bin/luap
EXTRATARGETS=$(INSTDIR)/bin/lua$(SHORTVERSION).dll $(INSTDIR)/lib/lua/$(MEDVERSION)/argparse.lua
IMPORTEXTRA:=$(IMPORTEXTRA_COMMUN)\nifeq ($$(filter mingw,$$(CROSS_ARCH)),)\n$(IMPORTEXTRA_WINDOWS)else\n$(IMPORTEXTRA_LINUX)endif\n\n$(IMPORTEXTRA_TARGETS)
else #ifeq ($(ISWINDOWS),true)
MARGS=linux local MYCFLAGS=-fPIC
EXTRATARGETS=$(INSTDIR)/lib/liblua.so $(INSTDIR)/bin/luap $(INSTDIR)/lib/lua/$(MEDVERSION)/argparse.lua
IMPORTEXTRA:=$(IMPORTEXTRA_COMMUN)$(IMPORTEXTRA_LINUX)\n$(IMPORTEXTRA_TARGETS)
endif # ifeq ($(ISWINDOWS),true)
MIARGS+=INSTALL_TOP=$(INSTDIR)
HASNATIVEMAKE:=1
#LICENSEFILE=$(SRCDIR)/COPYING

MARGS+=CC=$(CROSS_COMPILE)gcc