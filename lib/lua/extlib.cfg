VERSION=5.4.3
SRCURL=https://www.lua.org/ftp/lua-$(VERSION).tar.gz
PRODUCT=lua

SPVERSION:=$(subst ., ,$(VERSION))
VERSIONMAJ:=$(word 1,$(SPVERSION))
VERSIONMED:=$(word 2,$(SPVERSION))
SHORTVERSION=$(VERSIONMAJ)$(VERSIONMED)

ifeq ($(ISWINDOWS),true)
MARGS=PLAT=mingw
EXTRATARGETS=$(INSTDIR)/bin/lua$(SHORTVERSION).dll
SOEXT=dll
else
MARGS=linux local MYCFLAGS=-fPIC
EXTRATARGETS=$(INSTDIR)/lib/liblua.so
SOEXT=so
endif
MIARGS=INSTALL_TOP=$(INSTDIR)
HASNATIVEMAKE:=1
#LICENSEFILE=$(SRCDIR)/COPYING
IMPORTEXTRA:=LUA_DIR:=$$(dir $$(lastword $$(MAKEFILE_LIST)))\nLUA_CMD:=$$(LUA_DIR)/bin/lua\nLUA_CPATH=$$(subst $$(_space_),;,$$(patsubst -%%,,$$(patsubst -L%%,%%/lib?.$(SOEXT),$$(filter -L%%,$$(LDFLAGS))) $$(patsubst -L%%,%%/?.$(SOEXT),$$(filter -L%%,$$(LDFLAGS)))))\n\nlua:\n\tLD_LIBRARY_PATH="$$(LDLIBP)" LUA_CPATH="$$(LUA_CPATH)" $$(LUA_CMD) $$(RUNARGS)\n\n
