APPNAME=projA
VERSION=1.4.2
COMPANY=eduvax

ifneq ($(DISABLE_DYN_RUST),true)
# rust archive is generated by newRustPackage from a rust module.
USELIB+=rust-1.82.0
else
NOBUILD+=rustA
endif

VABS:=99.99.99
WGETFLAGS=--no-check-certificate
ABS_REPO:=file://$(PRJROOT)/../repository http://www.eduvax.net/dist file:///home/httpd/www/dist
DISTREPO:=file://$(PRJROOT)/../repository
ABSWS:=$(PRJROOT)/../absws

NODISTMOD=nodistlib

NDUSELIB+=libtest|1.0.0