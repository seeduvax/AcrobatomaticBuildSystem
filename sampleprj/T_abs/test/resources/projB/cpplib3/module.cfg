# test for an empty module

MODNAME=cpplib3
MODTYPE=library
LINKLIB=

SRC_ARCHIVES=$(wildcard resources/*.tar.gz)
SRC_EXTRACT_ARGS=--strip-components=2 --wildcards "*/src"!\
