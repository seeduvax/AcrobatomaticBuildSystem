APPNAME=projB
VERSION=2.4.2
COMPANY=eduvax

ifneq ($(DISABLE_DYN_RUST),true)
# rust archive is generated by newRustPackage from a rust module.
USELIB+=rust-1.82.0
else
NOBUILD+=rustlibB
endif

PUBLISH_TO_APP_LEVEL=true
STATIC_LIB=true
CPPUNIT=cppunit-1.14.0

USELIB=projA|1.4.2d testlib-dashed|1.0.1

WGETFLAGS=--no-check-certificate
VABS:=99.99.99
ABS_REPO:=file://$(PRJROOT)/../repository
ifeq ($(DISABLE_SSH_TEST),true)
DISTREPO:=file://$(PRJROOT)/../repository
else
DISTREPO:=localhost:$(PRJROOT)/../repository
endif
ABSWS:=$(PRJROOT)/../absws
